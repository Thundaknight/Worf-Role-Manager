services:
  worf:
    build: ./bot
    container_name: worf
    restart: unless-stopped
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - SELF_SERVICE_CHANNEL_ID=${SELF_SERVICE_CHANNEL_ID}
      - ADMIN_REQUEST_CHANNEL_ID=${ADMIN_REQUEST_CHANNEL_ID}
      - ADMIRAL_MANAGEMENT_CHANNEL_ID=${ADMIRAL_MANAGEMENT_CHANNEL_ID:-0}
      - SERVER_ROLE_ID=${SERVER_ROLE_ID:-0}
      - LEADERSHIP_CATEGORY_ID=${LEADERSHIP_CATEGORY_ID:-0}
      - ADMIN_ROLE_ID=${ADMIN_ROLE_ID:-0}
      - GUILD_ID=${GUILD_ID:-0}
      - ADMIRAL_ROLE_ID=${ADMIRAL_ROLE_ID:-0}
      - COMMODORE_ROLE_ID=${COMMODORE_ROLE_ID:-0}
      - FIRST_OFFICER_ROLE_ID=${FIRST_OFFICER_ROLE_ID:-0}
      - ROE_OFFICER_ROLE_ID=${ROE_OFFICER_ROLE_ID:-0}
      - DIPLOMACY_OFFICER_ROLE_ID=${DIPLOMACY_OFFICER_ROLE_ID:-0}
    volumes:
      - ./data:/data
